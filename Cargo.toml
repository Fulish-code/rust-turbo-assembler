[package]
name = "rust-tasm"
version = "1.2.1"
edition = "2024"
description = "GUI Turbo Assembler portado a Rust: IDE multiplataforma para TASM/TLINK/TD de 16 bits sobre DOSBox"
license = "GPL-3.0-or-later"
readme = "README.md"

[[bin]]
name = "rust-tasm"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui_dock = { version = "0.21", features = ["serde"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
open = "5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
